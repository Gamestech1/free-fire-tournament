<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Free Fire Tournament</title>
    <link rel="stylesheet" href="style.css">
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container" style="max-width: 600px;">
        <h1>Admin Panel - Create Tournament</h1>
        <form id="tournament-form">
            <input type="text" id="t-name" placeholder="Tournament Name" required style="width: 90%; padding: 10px; margin: 10px 0; background: #2e2e2e; border: 1px solid #444; color: white; border-radius: 5px;">
            <textarea id="t-desc" placeholder="Tournament Description" style="width: 90%; padding: 10px; margin: 10px 0; background: #2e2e2e; border: 1px solid #444; color: white; border-radius: 5px; height: 80px;"></textarea>
            <input type="number" id="t-fee" placeholder="Entry Fee (e.g. 0)" required style="width: 90%; padding: 10px; margin: 10px 0; background: #2e2e2e; border: 1px solid #444; color: white; border-radius: 5px;">
            <input type="text" id="t-prize" placeholder="Prize Pool (e.g. 1000 PKR)" required style="width: 90%; padding: 10px; margin: 10px 0; background: #2e2e2e; border: 1px solid #444; color: white; border-radius: 5px;">
            <input type="number" id="t-slots" placeholder="Total Slots (e.g. 48)" required style="width: 90%; padding: 10px; margin: 10px 0; background: #2e2e2e; border: 1px solid #444; color: white; border-radius: 5px;">
            <input type="text" id="t-mode" placeholder="Game Mode (e.g. Squad / Solo)" required style="width: 90%; padding: 10px; margin: 10px 0; background: #2e2e2e; border: 1px solid #444; color: white; border-radius: 5px;">
            <input type="datetime-local" id="t-time" required style="width: 90%; padding: 10px; margin: 10px 0; background: #2e2e2e; border: 1px solid #444; color: white; border-radius: 5px;">
            <button type="submit" class="btn" style="width: 100%; border: none; cursor: pointer; margin-top: 10px;">Create Tournament</button>
        </form>
        <p style="margin-top: 15px;"><a href="index.html" style="color: #ffcc00;">Back to Home</a></p>
    </div>

    <script>
        const SUPABASE_URL = 'https://drsjzstphlwjcwsrqeqd.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_hZJVRoZrDjACam9XllkTTg_93DIHSs4';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Check if logged in user is admin
        async function checkAdmin() {
            const { data: { user } } = await supabase.auth.getUser();
            if (!user) {
                alert('Please login first!');
                window.location.href = 'login.html';
                return;
            }

            const { data: profile } = await supabase
                .from('profiles')
                .select('role')
                .eq('id', user.id)
                .single();

            if (!profile || profile.role !== 'admin') {
                alert('Access Denied! You are not an admin.');
                window.location.href = 'index.html';
            }
        }

        checkAdmin();

        document.getElementById('tournament-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('t-name').value;
            const description = document.getElementById('t-desc').value;
            const entryFee = parseFloat(document.getElementById('t-fee').value);
            const prizePool = document.getElementById('t-prize').value;
            const totalSlots = parseInt(document.getElementById('t-slots').value);
            const gameMode = document.getElementById('t-mode').value;
            const startTime = document.getElementById('t-time').value;

            const { error } = await supabase.from('tournaments').insert([
                {
                    name: name,
                    description: description,
                    entry_fee: entryFee,
                    prize_pool: prizePool,
                    total_slots: totalSlots,
                    game_mode: gameMode,
                    start_time: startTime,
                    status: 'upcoming'
                }
            ]);

            if (error) {
                alert('Error creating tournament: ' + error.message);
            } else {
                alert('Tournament created successfully!');
                document.getElementById('tournament-form').reset();
            }
        });
    </script>
</body>
</html>
