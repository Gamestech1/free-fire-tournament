<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Free Fire Tournament</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <h1>Login</h1>
        <form id="login-form">
            <input type="email" id="email" placeholder="Email Address" required style="width: 90%; padding: 10px; margin: 10px 0; background: #2e2e2e; border: 1px solid #444; color: white; border-radius: 5px;">
            <input type="password" id="password" placeholder="Password" required style="width: 90% ; padding: 10px; margin: 10px 0; background: #2e2e2e; border: 1px solid #444; color: white; border-radius: 5px;">
            <button type="submit" class="btn" style="width: 100%; border: none; cursor: pointer; margin-top: 10px;">Login</button>
        </form>
        <p style="margin-top: 15px; font-size: 14px;">Don't have an account? <a href="register.html" style="color: #ffcc00;">Register here</a></p>
    </div>

    <script>
        const SUPABASE_URL = 'https://drsjzstphlwjcwsrqeqd.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_hZJVRoZrDjACam9XllkTTg_93DIHSs4';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const { data, error } = await supabase.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                alert('Login Error: ' + error.message);
                return;
            }

            alert('Login successful!');
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
